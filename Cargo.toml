[package]
name = "chre"
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
description = "CHRE: Causal Hypergraph Rewrite Engine"

[dependencies]
rand = { version = "0.10", features = ["std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.2"
rayon = "1.7"
fixedbitset = "0.5"
chrono = "0.4"
pyo3 = { version = "0.29", features = ["extension-module"] }

[lib]
name = "chre"
crate-type = ["cdylib", "rlib"]
