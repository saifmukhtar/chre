[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "chre"
version = "0.1.0"
description = "A high-performance Graph Grammar Engine via Double-Pushout"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Saif", email = "saif@example.com" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Maps the compiled Rust binary directly to the Python module
features = ["pyo3/extension-module"]
